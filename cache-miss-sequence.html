<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Request: Cache Miss Flow</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-subtle: rgba(56, 189, 248, 0.15);
      --green: #4ade80;
      --amber: #fbbf24;
      --purple: #c084fc;
      --rose: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .diagram-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 1080px;
      padding: 2rem 1.5rem;
      overflow-x: auto;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .meta-badge {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.25rem 0.75rem;
      background: var(--accent-subtle);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent);
      border-radius: 9999px;
      font-size: 0.75rem;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <header>
    <h1>Web Request Lifecycle: Cache Miss Flow</h1>
    <p>Browser calls API &rarr; Checks Redis (miss) &rarr; Queries PostgreSQL &rarr; Fills Redis cache</p>
    <div class="meta-badge">Archify Specification: diagram_type=sequence</div>
  </header>

  <div class="diagram-container">
    <svg viewBox="0 0 1080 560" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Arrowhead Marker Default -->
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
        </marker>
        <!-- Arrowhead Marker Return/Dashed -->
        <marker id="arrow-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
        </marker>
        <!-- Arrowhead Marker Miss -->
        <marker id="arrow-miss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
        </marker>
      </defs>

      <!-- Background Segment Groupings -->
      <!-- Segment 1: Lookup -->
      <rect x="40" y="130" width="1000" height="115" rx="8" fill="#1e293b" stroke="#334155" stroke-dasharray="4" opacity="0.6" />
      <text x="55" y="152" fill="#64748b" font-size="12" font-weight="600" text-transform="uppercase" letter-spacing="1">1. Initial Cache Lookup</text>

      <!-- Segment 2: Miss & DB Query -->
      <rect x="40" y="260" width="1000" height="125" rx="8" fill="#1e293b" stroke="#334155" stroke-dasharray="4" opacity="0.6" />
      <text x="55" y="282" fill="#64748b" font-size="12" font-weight="600" text-transform="uppercase" letter-spacing="1">2. Cache Miss & Database Query</text>

      <!-- Segment 3: Cache Fill & Response -->
      <rect x="40" y="400" width="1000" height="120" rx="8" fill="#1e293b" stroke="#334155" stroke-dasharray="4" opacity="0.6" />
      <text x="55" y="422" fill="#64748b" font-size="12" font-weight="600" text-transform="uppercase" letter-spacing="1">3. Cache Fill & Response</text>

      <!-- Participant Lifelines -->
      <!-- Browser (x=160) -->
      <line x1="160" y1="80" x2="160" y2="530" stroke="#334155" stroke-width="2" stroke-dasharray="6" />
      <!-- API Server (x=420) -->
      <line x1="420" y1="80" x2="420" y2="530" stroke="#334155" stroke-width="2" stroke-dasharray="6" />
      <!-- Redis (x=680) -->
      <line x1="680" y1="80" x2="680" y2="530" stroke="#334155" stroke-width="2" stroke-dasharray="6" />
      <!-- Postgres (x=920) -->
      <line x1="920" y1="80" x2="920" y2="530" stroke="#334155" stroke-width="2" stroke-dasharray="6" />

      <!-- Participant Headers -->
      <!-- Browser -->
      <rect x="85" y="30" width="150" height="50" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <text x="160" y="52" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">Browser</text>
      <text x="160" y="68" fill="#94a3b8" font-size="11" text-anchor="middle">client session</text>

      <!-- API Server -->
      <rect x="345" y="30" width="150" height="50" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" />
      <text x="420" y="52" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">API Server</text>
      <text x="420" y="68" fill="#94a3b8" font-size="11" text-anchor="middle">request handler</text>

      <!-- Redis Cache -->
      <rect x="605" y="30" width="150" height="50" rx="8" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" />
      <text x="680" y="52" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">Redis</text>
      <text x="680" y="68" fill="#94a3b8" font-size="11" text-anchor="middle">in-memory cache</text>

      <!-- PostgreSQL DB -->
      <rect x="845" y="30" width="150" height="50" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <text x="920" y="52" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">PostgreSQL</text>
      <text x="920" y="68" fill="#94a3b8" font-size="11" text-anchor="middle">source of truth</text>

      <!-- Activation Bars on Lifelines -->
      <rect x="415" y="170" width="10" height="340" rx="3" fill="#818cf8" opacity="0.8" />
      <rect x="675" y="200" width="10" height="35" rx="3" fill="#f43f5e" opacity="0.8" />
      <rect x="915" y="300" width="10" height="50" rx="3" fill="#38bdf8" opacity="0.8" />
      <rect x="675" y="435" width="10" height="35" rx="3" fill="#f43f5e" opacity="0.8" />

      <!-- Messages / Arrows -->

      <!-- 1. Browser -> API: GET /resource -->
      <line x1="160" y1="175" x2="415" y2="175" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
      <text x="285" y="167" fill="#38bdf8" font-size="12" font-family="monospace" text-anchor="middle">1. GET /api/v1/data</text>

      <!-- 2. API -> Redis: GET cache_key -->
      <line x1="425" y1="205" x2="675" y2="205" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
      <text x="550" y="197" fill="#e2e8f0" font-size="12" font-family="monospace" text-anchor="middle">2. GET cache:item:123</text>

      <!-- 3. Redis -> API: (nil) Cache Miss -->
      <line x1="675" y1="235" x2="425" y2="235" stroke="#f43f5e" stroke-width="2" stroke-dasharray="5" marker-end="url(#arrow-miss)" />
      <text x="550" y="227" fill="#f43f5e" font-size="12" font-family="monospace" font-weight="600" text-anchor="middle">3. (nil) [Cache Miss]</text>

      <!-- 4. API -> Postgres: Query DB -->
      <line x1="425" y1="305" x2="915" y2="305" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
      <text x="670" y="297" fill="#e2e8f0" font-size="12" font-family="monospace" text-anchor="middle">4. SELECT * FROM items WHERE id = 123</text>

      <!-- 5. Postgres -> API: Return Row -->
      <line x1="915" y1="350" x2="425" y2="350" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5" marker-end="url(#arrow-return)" />
      <text x="670" y="342" fill="#94a3b8" font-size="12" font-family="monospace" text-anchor="middle">5. Row Data (payload)</text>

      <!-- 6. API -> Redis: SETEX (Fill cache) -->
      <line x1="425" y1="440" x2="675" y2="440" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
      <text x="550" y="432" fill="#e2e8f0" font-size="12" font-family="monospace" text-anchor="middle">6. SETEX cache:item:123 3600 payload</text>

      <!-- 7. Redis -> API: OK -->
      <line x1="675" y1="470" x2="425" y2="470" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5" marker-end="url(#arrow-return)" />
      <text x="550" y="462" fill="#94a3b8" font-size="12" font-family="monospace" text-anchor="middle">7. OK</text>

      <!-- 8. API -> Browser: 200 OK -->
      <line x1="415" y1="510" x2="160" y2="510" stroke="#4ade80" stroke-width="2" stroke-dasharray="5" marker-end="url(#arrow-return)" />
      <text x="285" y="502" fill="#4ade80" font-size="12" font-family="monospace" font-weight="600" text-anchor="middle">8. 200 OK (JSON Payload)</text>

    </svg>
  </div>

</body>
</html>
